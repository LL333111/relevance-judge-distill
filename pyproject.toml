[project]
name = "relevance-judge-distill"
version = "0.1.0"
description = "Calibrate an LLM relevance judge on 5K human labels (ESCI), then distill it into a 0.6B reranker"
requires-python = ">=3.10"
# Base deps: data, splits, metrics, tests and analysis. These run anywhere
# (including Windows, no GPU).
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# GPU deps run on the Linux training machine only. Exact versions are frozen
# into requirements-gpu.lock from the first working install on that machine
# (Stage 1).
gpu = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
