# LLM relevance judge. One configuration, no grid.
model: Qwen/Qwen3-8B
max_product_tokens: 400   # product text is at most 1,200 characters
eval_batch_size: 64

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  seed: 0
  lr: 1.0e-4
  epochs: 3
  batch_size: 16
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_grad_norm: 1.0
